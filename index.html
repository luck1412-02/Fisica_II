<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Physics AI · Tutor de Física</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#17253d;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer} .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:#0e2244;color:#e9f4ff;padding:22px 15px}aside h1{font-size:24px;margin:0 8px 5px}aside p{font-size:12px;color:#a5c4e9;margin:0 8px 25px}.nav{width:100%;text-align:left;padding:13px;border:0;border-radius:10px;background:transparent;color:#d8e8fc;margin-bottom:5px}.nav:hover,.nav.active{background:#244574}.new{background:#2c9bdf;color:white;text-align:center;font-weight:700}.history{margin-top:25px;font-size:12px;color:#9abbe0}.history button{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}main{display:flex;flex-direction:column;height:100vh;min-width:0}.top{padding:18px 26px;border-bottom:1px solid #e0e8f2;background:white;display:flex;align-items:center;justify-content:space-between}.top strong{font-size:19px}.badge{background:#e7f5ff;color:#18628b;border-radius:30px;padding:6px 12px;font-size:12px}.screen{flex:1;overflow-y:auto;padding:30px max(24px,calc((100% - 920px)/2))}.welcome{text-align:center;margin:10vh auto;max-width:660px}.welcome h2{font-size:38px;color:#11325b}.welcome p{line-height:1.7;color:#60728b}.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:25px}.chips button{border:1px solid #d5e3f2;background:white;border-radius:12px;padding:12px;color:#17416c}.message{max-width:900px;margin:0 auto 22px;padding:18px 21px;border-radius:15px;line-height:1.7;overflow-wrap:anywhere}.message.user{background:#e2f0ff;margin-left:auto;max-width:75%}.message.assistant{background:white;border:1px solid #e0e9f4;box-shadow:0 3px 10px #d8e2f04d}.message p:first-child{margin-top:0}.message p:last-child{margin-bottom:0}.composer{padding:14px 25px 24px;background:#fff;border-top:1px solid #e0e8f2}.compose-inner{max-width:900px;margin:auto}.controls{display:flex;gap:12px;align-items:center;margin-bottom:10px}.controls select{border:1px solid #d8e5f1;padding:8px;border-radius:8px;background:white}.input-row{display:flex;align-items:end;gap:10px}textarea{width:100%;resize:vertical;min-height:58px;max-height:160px;border:1px solid #c9dbea;border-radius:13px;padding:16px;outline:none}textarea:focus{border-color:#2984c6}.send{background:#1677b8;border:0;color:white;border-radius:12px;padding:17px 22px;font-weight:bold}.upload{border:1px solid #bdd4e7;padding:10px;border-radius:9px;background:white;color:#215276}.hint{font-size:12px;color:#73839a;margin-top:8px}.panel{max-width:900px;margin:0 auto}.panel h2{font-size:27px;color:#123a6b}.card{background:white;border:1px solid #deebf7;border-radius:14px;padding:20px;margin:12px 0}.card h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.grid label{display:block;font-size:13px}.grid input{width:100%;padding:10px;margin-top:5px;border:1px solid #cddbea;border-radius:8px}canvas{width:100%;height:320px;border:1px solid #e2eaf5;border-radius:12px} .error{color:#b42318}.small{font-size:13px;color:#62748d} @media(max-width:700px){.app{grid-template-columns:1fr}aside{display:flex;overflow:auto;align-items:center;padding:8px;gap:6px}aside h1{font-size:16px;white-space:nowrap}aside p,.history{display:none}aside .nav{white-space:nowrap;width:auto;padding:9px;font-size:12px;margin:0}.app{display:flex;flex-direction:column}main{height:calc(100vh - 57px)}.screen{padding:18px 12px}.top{padding:13px}.message.user{max-width:95%}.composer{padding:12px}.welcome h2{font-size:27px}}
</style></head><body><div class="app"><aside><h1>⚛ Physics AI</h1><p>Tu tutor inteligente de Física</p><button class="nav new" onclick="newChat()">＋ Nuevo chat</button><button class="nav active" onclick="showTab('chat',this)">💬 Tutor IA</button><button class="nav" onclick="showTab('formulas',this)">📐 Formulario</button><button class="nav" onclick="showTab('lab',this)">🚀 Laboratorio</button><div class="history" id="history"><b>CONVERSACIONES</b></div></aside><main><header class="top"><strong id="title">Tutor inteligente de Física</strong><span class="badge" id="status">Comprobando API…</span></header><section class="screen" id="screen"></section><footer class="composer" id="composer"><div class="compose-inner"><div class="controls"><select id="mode"><option value="resolver">Resolver paso a paso</option><option value="aprender">Aprender</option><option value="practicar">Practicar</option><option value="examen">Modo examen</option><option value="aprender_a_resolver">Aprende a resolver</option></select><label class="upload">📎 Imagen<input id="image" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><span class="small" id="fileName"></span></div><div class="input-row"><textarea id="question" placeholder="Escribe tu ejercicio de Física o adjunta una fotografía…"></textarea><button class="send" id="send" onclick="sendMessage()">Enviar ↗</button></div><div class="hint">Shift + Enter para salto de línea · Enter para enviar · Las respuestas de IA pueden contener errores.</div></div></footer></main></div>
<script>
let currentId=null, pendingImage=null, activeTab='chat'; const screen=document.getElementById('screen');
const welcome=`<div class="welcome"><div style="font-size:55px">⚛️</div><h2>¿Qué aprenderemos hoy?</h2><p>Resuelve ejercicios de Física paso a paso, pregunta por qué se utiliza una fórmula o adjunta una fotografía. También puedes practicar con un tutor que se adapta a tus preguntas.</p><div class="chips"><button onclick="sample('Resuelve un bloque de 10 kg en un plano inclinado de 30° con rozamiento 0.2, usando g=9.8 m/s²')">Plano inclinado</button><button onclick="sample('Explícame la segunda ley de Newton por ejes')">Leyes de Newton</button><button onclick="sample('Enséñame la regla de la mano derecha para el campo magnético')">Magnetismo</button></div></div>`;
function sample(t){document.getElementById('question').value=t;document.getElementById('question').focus()}
function newChat(){currentId=null;showTab('chat');document.getElementById('question').value='';pendingImage=null;document.getElementById('fileName').textContent=''}
function showTab(tab,btn){activeTab=tab;document.querySelectorAll('aside .nav').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');document.getElementById('composer').style.display=tab==='chat'?'block':'none';document.getElementById('title').textContent={chat:'Tutor inteligente de Física',formulas:'Formulario de Física',lab:'Laboratorio virtual'}[tab];if(tab==='chat'){if(!currentId)screen.innerHTML=welcome;else loadConversation(currentId)}if(tab==='formulas')loadFormulas();if(tab==='lab')showLab()}
function renderMarkdown(text){return DOMPurify.sanitize(marked.parse(text,{breaks:true}))}
function addMessage(role,content){if(screen.querySelector('.welcome'))screen.innerHTML='';let el=document.createElement('article');el.className='message '+role;el.innerHTML=renderMarkdown(content);screen.appendChild(el);screen.scrollTop=screen.scrollHeight;if(window.MathJax?.typesetPromise)MathJax.typesetPromise([el]).catch(()=>{});return el}
async function api(path,opts){let r=await fetch(path,opts);let d=await r.json();if(!r.ok)throw Error(d.detail||'Error de conexión');return d}
async function loadHistory(){try{let data=await api('/api/conversations');let el=document.getElementById('history');el.innerHTML='<b>CONVERSACIONES</b>';data.forEach(c=>{let b=document.createElement('button');b.className='nav';b.textContent=c.title;b.title=c.title;b.onclick=()=>{currentId=c.id;showTab('chat')};el.appendChild(b)})}catch(e){console.warn(e)}}
async function loadConversation(id){screen.innerHTML='<p class="small">Cargando conversación…</p>';try{let data=await api('/api/conversations/'+encodeURIComponent(id));screen.innerHTML='';data.forEach(m=>addMessage(m.role,m.content))}catch(e){screen.textContent=e.message}}
async function sendMessage(){let q=document.getElementById('question'),text=q.value.trim();if(!text)return;let send=document.getElementById('send');send.disabled=true;q.value='';addMessage('user',text+(pendingImage?'\n\n📎 Imagen adjunta':''));let loading=addMessage('assistant','_Analizando el ejercicio…_');try{let data=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:currentId,message:text,mode:document.getElementById('mode').value,...pendingImage})});currentId=data.conversation_id;loading.innerHTML=renderMarkdown(data.answer+'\n\n---\n*'+data.verification+'*');if(window.MathJax?.typesetPromise)MathJax.typesetPromise([loading]).catch(()=>{});pendingImage=null;document.getElementById('image').value='';document.getElementById('fileName').textContent='';loadHistory()}catch(e){loading.innerHTML='<span class="error">'+DOMPurify.sanitize(e.message)+'</span>';q.value=text}finally{send.disabled=false;screen.scrollTop=screen.scrollHeight}}
document.getElementById('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
document.getElementById('image').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;document.getElementById('fileName').textContent='Cargando…';try{let data=new FormData();data.append('file',f);let uploaded=await api('/api/images',{method:'POST',body:data});pendingImage={image_base64:uploaded.base64,image_mime:uploaded.mime};document.getElementById('fileName').textContent='✓ '+f.name}catch(err){document.getElementById('fileName').textContent=err.message}});
async function loadFormulas(){screen.innerHTML='<div class="panel"><h2>Biblioteca de fórmulas</h2><p class="small">Selecciona una ecuación para pedir una explicación al tutor.</p><div id="formulaList"></div></div>';try{let data=await api('/api/formulas');let list=document.getElementById('formulaList');data.forEach(f=>{let div=document.createElement('div');div.className='card';div.innerHTML=`<small>${f.topic}</small><h3>${f.name}</h3><p>$$${f.latex}$$</p><p>${f.description}</p>`;let b=document.createElement('button');b.className='upload';b.textContent='Explícame esta fórmula';b.onclick=()=>{newChat();sample('Explícame cómo se obtiene y cuándo se aplica: '+f.name)};div.appendChild(b);list.appendChild(div)});if(window.MathJax?.typesetPromise)MathJax.typesetPromise([list]).catch(()=>{})}catch(e){screen.textContent=e.message}}
function showLab(){screen.innerHTML=`<div class="panel"><h2>Simulador de movimiento parabólico</h2><p class="small">Modelo sin resistencia del aire y con gravedad constante.</p><div class="card"><div class="grid"><label>Velocidad inicial (m/s)<input id="speed" type="number" value="20" min="0" max="1000"></label><label>Ángulo (°)<input id="angle" type="number" value="45" min="-89" max="89"></label><label>Altura inicial (m)<input id="height" type="number" value="0" min="0"></label><label>Gravedad (m/s²)<input id="gravity" type="number" value="9.8" step="0.1" min="0.01"></label></div><p><button class="send" onclick="simulate()">Simular trayectoria</button></p><canvas id="chart" width="900" height="350"></canvas><div id="simResults"></div></div></div>`;simulate()}
async function simulate(){try{let p={};for(let k of ['speed','angle','height','gravity'])p[k]=Number(document.getElementById(k).value);let d=await api('/api/projectile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let canvas=document.getElementById('chart'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,900,350);let maxX=Math.max(...d.points.map(x=>x.x),1),maxY=Math.max(...d.points.map(x=>x.y),1);ctx.strokeStyle='#d1deea';ctx.beginPath();ctx.moveTo(50,15);ctx.lineTo(50,310);ctx.lineTo(875,310);ctx.stroke();ctx.strokeStyle='#147fc0';ctx.lineWidth=3;ctx.beginPath();d.points.forEach((pt,i)=>{let x=50+pt.x/maxX*805,y=310-pt.y/maxY*275;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#1b3b62';ctx.font='14px Arial';ctx.fillText('x (m) →',800,335);ctx.fillText('y (m)',7,25);document.getElementById('simResults').innerHTML=`<p><b>Tiempo de vuelo:</b> ${d.flight_time.toFixed(3)} s &nbsp; <b>Alcance:</b> ${d.range.toFixed(3)} m &nbsp; <b>Altura máxima:</b> ${d.max_height.toFixed(3)} m</p><p class="small">${d.assumptions}</p>`}catch(e){document.getElementById('simResults').textContent=e.message}}
fetch('/api/status').then(r=>r.json()).then(d=>{let s=document.getElementById('status');s.textContent=d.ready?'● IA configurada':'⚠ Configura tu API key';s.style.background=d.ready?'#e1f8e9':'#fff0d7'});screen.innerHTML=welcome;loadHistory();
</script></body></html>
